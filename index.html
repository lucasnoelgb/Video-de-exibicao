<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f0e9">
  <title>Seu vídeo está pronto | Lia</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172c3b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 36px 18px; background: linear-gradient(125deg, #d8eee1 0%, #dcebea 48%, #f0e7d9 100%); }
    main { width: min(100%, 860px); }
    .card { border-radius: 22px; background: #faf8ed; box-shadow: 0 20px 55px #25463c26; padding: clamp(20px, 4vw, 34px); }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 800; letter-spacing: -.04em; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #138d74; background: #d8f2e6; border: 2px solid #69c8a6; font-size: .95rem; }
    .badge { border-radius: 999px; padding: 6px 11px; background: #e5f1ed; color: #247b70; font-size: .76rem; font-weight: 700; }
    h1 { margin: 0 0 9px; font-size: clamp(1.65rem, 4vw, 2.25rem); line-height: 1.12; letter-spacing: -.045em; }
    .intro { color: #63747a; margin: 0 0 22px; line-height: 1.5; }
    .player { overflow: hidden; border-radius: 16px; background: #172c3b; box-shadow: 0 8px 24px #203b3820; }
    video { display: block; width: 100%; max-height: 62vh; background: #172c3b; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px; flex-wrap: wrap; }
    .volume { display: flex; align-items: center; gap: 9px; }
    .volume-label { color: #e7f2ed; font-size: .88rem; min-width: 86px; }
    button, .download { appearance: none; border: 1px solid #d8e6dc; border-radius: 10px; background: #f7f8ed; color: #183645; padding: 9px 13px; font: inherit; font-weight: 750; cursor: pointer; transition: filter .15s, transform .15s; }
    button:hover, .download:hover { filter: brightness(1.05); }
    button:active, .download:active { transform: translateY(1px); }
    .download { border: 0; text-decoration: none; color: #fff; background: linear-gradient(105deg, #177db1, #22a36c); padding: 11px 16px; }
    button:focus-visible, .download:focus-visible { outline: 3px solid #f4a755; outline-offset: 3px; }
    .hint { color: #73827f; font-size: .84rem; line-height: 1.45; margin: 13px 2px 0; }
    @media (max-width: 520px) { body { padding: 18px 12px; } .bar { align-items: stretch; } .volume { justify-content: center; } .download { text-align: center; width: 100%; } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="brand-row">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>Lia</span></div>
        <span class="badge">Vídeo pronto</span>
      </div>
      <h1>Assista à sua gravação</h1>
      <p class="intro">Dê o play, ajuste o volume e aproveite.</p>
      <section class="player" aria-label="Reprodutor de vídeo">
        <video id="video" controls preload="metadata" playsinline>
          <source src="gravacao-com-musica.mp4" type="video/mp4">
          Seu navegador não consegue reproduzir este vídeo. Você pode baixá-lo pelo botão abaixo.
        </video>
        <div class="bar">
          <div class="volume" aria-label="Controles de volume">
            <button id="down" type="button" aria-label="Diminuir volume" title="Diminuir volume">−</button>
            <span class="volume-label" id="volumeValue" aria-live="polite">Volume: 100%</span>
            <button id="up" type="button" aria-label="Aumentar volume" title="Aumentar volume">+</button>
          </div>
          <a class="download" href="gravacao-com-musica.mp4" download="gravacao-com-musica.mp4">Baixar vídeo ↓</a>
        </div>
      </section>
      <p class="hint">Os botões + e − ajustam o volume em passos de 10%. Você também pode usar os controles no próprio vídeo.</p>
    </section>
  </main>
  <script>
    const video = document.getElementById('video');
    const label = document.getElementById('volumeValue');
    function updateVolume() {
      label.textContent = `Volume: ${Math.round(video.volume * 100)}%${video.muted ? ' (mudo)' : ''}`;
    }
    document.getElementById('down').addEventListener('click', () => {
      video.muted = false;
      video.volume = Math.max(0, Math.round((video.volume - 0.1) * 10) / 10);
      updateVolume();
    });
    document.getElementById('up').addEventListener('click', () => {
      video.muted = false;
      video.volume = Math.min(1, Math.round((video.volume + 0.1) * 10) / 10);
      updateVolume();
    });
    video.addEventListener('volumechange', updateVolume);
    updateVolume();
  </script>
</body>
</html>
